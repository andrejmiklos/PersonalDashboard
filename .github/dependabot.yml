version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Node 22 is the runtime (engines, CI): typings must not offer APIs Node 22 lacks.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # A compiler major is its own planned step, not a weekly update.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    groups:
      # One PR for all minor/patch updates; majors come one by one to be checked separately.
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
